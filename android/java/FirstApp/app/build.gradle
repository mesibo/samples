apply plugin: 'com.android.application'

// mesibo versions and settings (getMesiboVersion, getMesiboProperty), always the latest.
// You can remove this line and set the versions yourself.
apply from: "https://cdn.mesibo.com/android/mesibo.gradle"

android {
    namespace 'com.mesibo.firstapp'
    compileSdk getMesiboProperty("Mesibo_compileSdkVersion", null, true) as int

    defaultConfig {
        applicationId "com.mesibo.firstapp"
        minSdk getMesiboProperty("Mesibo_minSdkVersion", null, true) as int
        targetSdk getMesiboProperty("Mesibo_targetSdkVersion", null, true) as int
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation "com.mesibo.api:mesibo:${getMesiboVersion("Api")}"
    implementation "com.mesibo.api:ui:${getMesiboVersion("Ui")}"
    implementation "com.mesibo.api:calls:${getMesiboVersion("Calls")}"
}
